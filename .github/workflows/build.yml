name: CI

on:
  push:
    branches: [ pc_port ]
  pull_request:
    branches: [ pc_port ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install portable build dependencies
        run: |
          sudo apt update
          sudo apt install --no-install-recommends build-essential curl zstd libpng-dev libsdl2-dev libvulkan-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          curl -L https://archive.org/download/sdl-2-2.0.16/SDL2-devel-2.0.16-mingw.tar.gz -o /tmp/SDL2-devel-mingw.tar.gz
          tar -xzf /tmp/SDL2-devel-mingw.tar.gz -C /tmp
          mv /tmp/SDL2-2.0.16 SDL2
      - name: Build Linux and Windows (64-bit)
        run: JOBS=$(nproc) ./build-all.sh
