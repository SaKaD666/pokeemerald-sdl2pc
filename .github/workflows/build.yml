name: CI

on:
  push:
    branches: [ pc_port ]
  pull_request:
    branches: [ pc_port ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install portable build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install --no-install-recommends build-essential curl libpng-dev libsdl2-dev gcc-multilib g++-multilib libsdl2-dev:i386 gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          curl -L https://archive.org/download/sdl-2-2.0.16/SDL2-devel-2.0.16-mingw.tar.gz -o /tmp/SDL2-devel-mingw.tar.gz
          tar -xzf /tmp/SDL2-devel-mingw.tar.gz -C /tmp
          mv /tmp/SDL2-2.0.16 SDL2

      - name: Windows (64-bit)
        env:
          IS64BIT: 1
        run: make -j${nproc} winwsl

      - name: Windows (32-bit)
        env:
          IS64BIT: 0
        run: make -j${nproc} winwsl

      - name: Linux (64-bit)
        env:
          IS64BIT: 1
        run: make -j${nproc} linux

      - name: Linux (32-bit)
        env:
          IS64BIT: 0
        run: make -j${nproc} linux
